name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Dist
        run: npm run build

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Keystore (if provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          fi

      - name: Build Android APKs
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThrottleLog-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThrottleLog-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare APKs for Release
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk throttlelog.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk throttlelog-debug.apk

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.0
          name: "ThrottleLog Android APK v1.2.0"
          body: |
            ### ThrottleLog Android Standalone APK (v1.2.0)
            Direct standalone motorcycle crew radar & blackbox tracker for Android:
            - **Native Android Intercom Audio (TTS)**: Direct text-to-speech audio bridge routing spoken milestone alerts, callouts, and SOS directly to Cardo, Sena, and BluArmor helmet communicators.
            - **Named Emergency SOS Voice Broadcast**: Intercom announces the exact sender callsign ("Emergency! SOS alert from [Rider Name]! Pull over and check map immediately!").
            - **Squad Lead Designation & Trailing Guidance**: Real-time relative bearing arrow, separation distance, and glowing vector guidance line to follow the squad leader or any chosen rider.
            - **1-Tap PTT Voice Blast in Callout Alerts**: Embedded Push-To-Talk walkie-talkie directly inside the Quick Squad Callout sheet and incoming callout banners.
            - **Offline Pune & Western Ghats Regional Download**: 1-tap pre-download of Pune, Mulshi, Lavasa, Lonavala, and Tamhini Ghat for zero-cellular coverage riding.
            - **Instant Accidental Ride Stop & Discard**: Rides under 80m or 2 points stop cleanly without blocking alerts.
            - **Fixed Handlebar Mount Landscape Compass**: True-north and heading calculations accurately synchronized when phone is mounted horizontally on bike handlebars.
          files: |
            throttlelog.apk
            throttlelog-debug.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
